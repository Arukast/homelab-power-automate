# =============================================================================
# Homelab Power Orchestrator Telegram & Discord Notification Messages Configuration
# File: /etc/homelab_messages.conf
# =============================================================================

# --- General System Status / Power Daemon Notifications ---
# Sent when the power proxy daemon detects host power transition events
MSG_DAEMON_AWAKE="\[Host Online] Proxmox host is awake! Self-hosted services are fully accessible."
MSG_DAEMON_SLEEP="\[Host Sleeping] Proxmox host has successfully entered S3 Suspend-to-RAM. Redirection proxies and WoL triggers are active."
MSG_DAEMON_SHUTDOWN="\[Host Shutdown] Proxmox host has been shut down cleanly."
MSG_DAEMON_REBOOT="\[Host Rebooting] Proxmox host is rebooting..."
MSG_DAEMON_SHUTDOWN_AWAKE="\[Host Restored] Proxmox host has been powered back on and is online!"
MSG_DAEMON_REBOOT_AWAKE="\[Host Restored] Proxmox host has successfully rebooted and is back online!"

# --- Traffic & Port Wake Listeners ---
# Variables available dynamically: $PORT_RAW, $VMID, $GUEST_IP, $HOST_MAC
MSG_WAKE_GUEST_DEMAND="\[Guest Wake-on-Demand] Traffic detected on port \`$PORT_RAW\`! Successfully resumed Guest ID *\$VMID* (\$GUEST_IP) on Proxmox."
MSG_WAKE_GAME_PLAYER="\[Player Connection] Player detected on game port \`$PORT_RAW\`! Sending Wake-on-LAN magic packet to ProxmoxNIC..."

# --- Proxmox VE Idle Monitor Notifications ---
# Sent by Proxmox when guests enter dynamic idle sleep
# Variables available dynamically: $VMID, $GUEST_NAME, $TIMEOUT_MIN
MSG_PROXMOX_GUEST_SUSPENDED="\[Guest Idle Sleep] Service *\$GUEST_NAME* (VMID \$VMID) was idle for \$TIMEOUT_MIN minutes and has been successfully suspended to reclaim system resources!"
MSG_PROXMOX_GUEST_STOPPED="\[Guest Idle Sleep] Service *\$GUEST_NAME* (VMID \$VMID) was idle for \$TIMEOUT_MIN minutes and has been stopped cleanly to reclaim system resources!"
MSG_PROXMOX_HOST_SLEEPING="\[Proxmox Host Sleeping] Host is entering S3 Suspend-to-RAM. All system states successfully saved!"
MSG_PROXMOX_HOST_AWAKE="\[Proxmox Host Awake] Host successfully woke up from ACPI S3 sleep. Restoring all guest VMs..."

# --- Telegram Bot Response Messages ---
MSG_BOT_HELP="\[Homelab Power Orchestrator Bot]
Available commands:

Host Power Control:
• /status - Check host power and PVE resource status
• /wake - Wake the Proxmox host (Wake-on-LAN)
• /sleep - Safe sleep (only if system is completely idle)
• /sleepforce - Force sleep immediately (skips idle checks)
• /hostshutdown - Safe shutdown (only if no guest nodes are running)
• /hostshutdownforce - Force shutdown immediately (ignores running guests)
• /hostreboot - Safe reboot (only if no guest nodes are running)
• /hostrebootforce - Force reboot immediately (ignores running guests)

Guest Node Control:
• /list - List all LXC containers and VMs
• /start <vmid> - Start a VM or LXC (type auto-detected)
• /stop <vmid> - Stop a VM or LXC
• /restart <vmid> - Restart a VM or LXC
• /node <vm|ct> <vmid> <start|stop|restart> - Explicit guest control

Maintenance:
• /maintenance - Show maintenance usage"

MSG_BOT_QUERY_STATUS="\[Status] Querying Proxmox host status, please wait..."
MSG_BOT_HOST_SLEEPING="\[Host Status] Proxmox host is currently SLEEPING (Offline)."
MSG_BOT_SSH_FAILED="\[Error] Connected to Proxmox IP but SSH connection failed. Check dropbear SSH keys."
MSG_BOT_WOL_SENT="\[WOL] Sending Wake-on-LAN magic packet to Proxmox (\$HOST_MAC)..."
MSG_BOT_WOL_DISPATCHED="\[Success] Magic packet dispatched! Host should be online in 30-45 seconds."
MSG_BOT_WOL_ALREADY_AWAKE="\[Status] Proxmox host is already ONLINE. No Wake-on-LAN needed."

MSG_BOT_SLEEP_TRIGGERED="\[Sleep] Triggering safe manual sleep cycle on Proxmox..."
MSG_BOT_SLEEP_FORCE_TRIGGERED="\[Sleep] Triggering FORCED sleep sequence on Proxmox (skipping idle checks)..."
MSG_BOT_SLEEP_EXECUTED="\[Success] Sleep command executed. Proxmox will gracefully suspend guests and sleep."

MSG_BOT_SHUTDOWN_SENDING="\[Shutdown] Checking status and sending graceful shutdown command to Proxmox host..."
MSG_BOT_SHUTDOWN_FORCE_SENDING="\[Shutdown] Sending FORCED shutdown command to Proxmox host..."
MSG_BOT_SHUTDOWN_EXECUTED="\[Success] Shutdown initiated."

MSG_BOT_REBOOT_SENDING="\[Reboot] Checking status and sending reboot command to Proxmox host..."
MSG_BOT_REBOOT_FORCE_SENDING="\[Reboot] Sending FORCED reboot command to Proxmox host..."
MSG_BOT_REBOOT_EXECUTED="\[Success] Reboot initiated."

MSG_BOT_LIST_HOST_OFFLINE="\[Status] Cannot list guest nodes: Proxmox host is offline."

# Sent when a safe action (/sleep, /hostshutdown, /hostreboot) is refused by the
# host's idle checks. \$arg1 = the command, \$arg2 = the reason, \$arg3 = its
# force variant.
MSG_BOT_ACTION_BLOCKED="\[Blocked] \`\$arg1\` was cancelled — the host is NOT idle:
_\$arg2_

Run \`\$arg3\` to override."

# Sent when the host-side pre-check could not be evaluated. \$arg1 = the command.
# Three variants, so the failure points at the right side to redeploy.
MSG_BOT_PRECHECK_UNSUPPORTED="\[Warning] Proxmox idle monitor on the host is out of date (no \`--check\` support) — proceeding with \`\$arg1\`. Redeploy the proxmox/ scripts."
MSG_BOT_PRECHECK_DENIED="\[Warning] The SSH wrapper on the host rejected the pre-check (out of date) — proceeding with \`\$arg1\`. Redeploy the proxmox/ scripts (wrapper)."
MSG_BOT_PRECHECK_UNAVAILABLE="\[Warning] Could not verify the host's idle state (pre-check unavailable) — proceeding with \`\$arg1\`. Check SSH connectivity to Proxmox."
MSG_BOT_PRECHECK_BUSY="\[Busy] The Proxmox host is running another idle check right now — \`\$arg1\` was not started. Please try again in a moment."

